spring.datasource.url=jdbc:postgresql://localhost:5432/roda_core_db
spring.datasource.username=admin
spring.datasource.password=roda
# schema from the real Flyway migrations (shipped in roda-wui), validated against the entities
spring.flyway.enabled=true
spring.flyway.locations=filesystem:../../roda-ui/roda-wui/src/main/resources/db/migration
spring.jpa.hibernate.ddl-auto=validate
# as in roda-wui: lets String attributes bind to uuid/jsonb columns (db.jobs entities)
spring.datasource.hikari.data-source-properties.stringtype=unspecified

#spring.jpa.show-sql=true
spring.sql.init.mode=always

#logging.level.org.springframework.orm.jpa=DEBUG
#logging.level.org.springframework.data.jpa=DEBUG