  Esta tarefa visa corrigir inconsistências entre o que é mostrado na interface gráfica do repositório e o que é efetivamente mantido na camada de armazenamento. Tais inconsistências podem ocorrer por \
  várias razões, por exemplo, corrupção de índice, encerramento abrupto do repositório, etc.
