plugin.aipCorruptionRiskAssessmentPlugin.name: Dateiintegritätsprüfung
plugin.aipCorruptionRiskAssessmentPlugin.description: Das Plugin zur Dateiintegritätsprüfung berechnet die Fixity-/Prüfsummeninformationen von Dateien innerhalb eines Archivalischen Informationspakets (AIP) \
  und überprüft, ob diese Informationen von den in den Erhaltungsmetadaten gespeicherten Informationen abweichen. Falls ja, wird ein neues Risiko erstellt und die beschädigte Datei diesem Risiko im Risikoregister zugeordnet. \
  Das Plugin erstellt auch einen Vorfall, der mit der Repräsentation verknüpft ist, wenn eine PREMIS-Datei existiert, aber die zugehörige Datei nicht. Innerhalb des Repositorys wird die Fixity-Prüfung verwendet, um sicherzustellen, dass digitale \
  Dateien nicht durch Datenzerfall oder andere Gefahren der digitalen Erhaltung beeinträchtigt wurden. Die Fixity-Prüfung allein gewährleistet nicht die Erhaltung einer digitalen Datei. Stattdessen ermöglicht sie dem Repository, \
  beschädigte Dateien zu identifizieren, die durch eine saubere Kopie vom Produzenten oder aus einer Sicherung ersetzt werden müssen.

