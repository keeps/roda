plugin.destroyRecordsPlugin.description:Vernichtet Datensätze unter einem Kassationsbestätigungsbericht und verschiebt sie in eine Kassationsstruktur, damit sie später wiederhergestellt oder \
  dauerhaft aus dem Speicher gelöscht werden können. Dieser Prozess markiert das AIP als vernichtet und ein PREMIS-Ereignis wird nach Abschluss der Aufgabe aufgezeichnet.
