plugin.fixAncestorsPlugin.name: AIP-Vorfahrenhierarchie korrigieren
plugin.fixAncestorsPlugin.description: Versucht, die Vorfahrenhierarchie der AIPs im Katalog zu korrigieren, indem Geister (d.h. AIPs mit nicht existierenden Vorfahren im Katalog) entfernt \
  und AIPs mit demselben Ingest-SIP-Identifikator zusammengeführt werden. Diese Aufgabe zielt darauf ab, Probleme zu beheben, die auftreten können, wenn SIPs übernommen werden, aber nicht alle notwendigen Elemente zur Konstruktion der \
  Kataloghierarchie empfangen oder korrekt übernommen wurden.

