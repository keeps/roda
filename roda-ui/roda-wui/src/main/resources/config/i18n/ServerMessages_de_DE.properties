plugin.auditLogTruncatorPlugin.name:Audit-Protokoll-Bereinigung
plugin.auditLogTruncatorPlugin.description:Die Audit-Protokoll-Bereinigung entfernt alle Einträge im Audit-Protokoll, die älter als die angegebene Anzahl von Tagen sind. \
  Das Protokoll wird als externe physische Dateien aufbewahrt, jedoch werden ältere Einträge nicht in der grafischen Benutzeroberfläche angezeigt. \
  Um auf ältere Protokolleinträge zuzugreifen, ist ein Zugang zur Speicherschicht des Repository-Servers erforderlich. \
  Die Bereinigung des Audit-Protokolls gibt automatisch Indexspeicher frei und verbessert die Gesamtleistung des Repositorys.
