plugin.inventoryReportPlugin.name:Inventarbericht-Erstellung
plugin.inventoryReportPlugin.description:Das Plugin zur Inventarbericht-Erstellung automatisiert die Generierung eines detaillierten Inventarberichts im CSV-Format für alle AIPs und die zugehörigen Dateien (Daten und Metadaten) \
  innerhalb eines Repositorys. Der Bericht enthält technische Informationen wie SIP-ID, AIP-ID, Repräsentations-ID, Dateipfad und kryptografische Hashwerte wie SHA-256, MD5 und SHA-1. \
  Diese Informationen können verwendet werden, um die Vollständigkeit und Korrektheit des Repository-Inhalts durch Vergleich mit früheren Inventarberichten aus der Vor-Übernahme zu validieren. \
  Die Inventarbericht-Vergleichsanwendung ist ein optionales Werkzeug zum Vergleich von Inventarberichten aus verschiedenen Zeiträumen. \
  Dies ermöglicht eine einfache Identifizierung von Änderungen oder Abweichungen im Repository-Inhalt über die Zeit. Um mehr über die Inventarbericht-Vergleichsanwendung zu erfahren oder eine Demo anzufordern, kontaktieren Sie bitte sales@keep.pt.
