plugin.riskAssociationPlugin.name: Risikovorfall-Erstellung
plugin.riskAssociationPlugin.description: Das Risikozuordnungs-Plugin ordnet ausgewählte Elemente (AIPs, Repräsentationen oder Dateien) bestehenden Risiken im Risikoregister zu (als Risikovorfälle). \
  Diese Aktion ist nützlich, wenn der Erhaltungsexperte eine Reihe von Elementen einem Risiko zuordnen möchte, das in naher Zukunft gemindert werden soll. \
  Wenn beispielsweise die Zielgruppe des Repositorys meldet, dass ein bestimmtes Format in einer bestimmten Sammlung nicht korrekt in der grafischen Benutzeroberfläche des Repositorys angezeigt wird, \
  möchte der Erhaltungsexperte diese Dateien möglicherweise für eine Erhaltungsaktion markieren (z.B. neue Repräsentationen für Zugriffszwecke erstellen).
