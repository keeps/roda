plugin.antivirusPlugin.name:Malware-Erkennung
plugin.antivirusPlugin.description:Dieses Plugin bietet robuste Sicherheitsfunktionen durch Nutzung der ClamAV-Antivirus-Engine zum Scannen von Dateien auf potenzielle Bedrohungen, einschließlich Trojaner, Viren, Malware und andere schädliche Inhalte. \
  ClamAV ist eine vertrauenswürdige Open-Source-Antivirus-Engine (GPL), die in der Branche weit verbreitet ist und sich durch außergewöhnliche Genauigkeit und Effektivität bei der Erkennung von Bedrohungen auszeichnet.
plugin.premisSkeletonPlugin.name:Berechnung von Dateiinformationen
plugin.premisSkeletonPlugin.description:Berechnet die Fixity-Informationen (auch bekannt als Prüfsumme) für alle Datendateien innerhalb eines AIP, einer Repräsentation oder Datei und speichert diese Informationen in PREMIS-Objekten \
  innerhalb der entsprechenden Entität. Diese Aufgabe verwendet SHA-256 als Standard-Prüfsummenalgorithmus, es können jedoch auch andere Algorithmen konfiguriert werden.
plugin.siegfriedPlugin.name:Dateiformaterkennung
plugin.siegfriedPlugin.description:Das Plugin zur Dateiformaterkennung ist ein wesentliches Werkzeug zur Identifizierung und Analyse verschiedener Dateiformate. \
  Es liefert umfassende Informationen zu jeder Datei, einschließlich Name, Bezeichnung, Version, MIME-Typ und PRONOM-Identifikator. \
  Diese Informationen können verwendet werden, um die geeignete Software zum Öffnen und Bearbeiten der Datei zu bestimmen sowie die Kompatibilität mit verschiedenen Systemen und Anwendungen sicherzustellen.
