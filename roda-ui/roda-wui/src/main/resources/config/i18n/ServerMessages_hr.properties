plugin.auditLogTruncatorPlugin.description:Skraćivanje dnevnika revizije uklanja sve unose u dnevniku revizije starije od navedenog broja dana. \
  Dnevnik se čuva kao vanjske fizičke datoteke, no stariji unosi neće biti prikazani u grafičkom korisničkom sučelju. \
