name: 'Testing'

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9
      - name: Cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Expand GWT permutations
        if: github.ref == 'refs/heads/master'
        run: |
          GWT_MODULE=roda-ui/roda-wui/src/main/java/org/roda/wui/RodaWUI.gwt.xml
          grep -q '<collapse-all-properties />' "$GWT_MODULE"
          sed -i 's#<collapse-all-properties />#<!--collapse-all-properties/-->#' "$GWT_MODULE"
      - name: Install clamdscan
        run: sudo apt-get update && sudo apt-get install clamdscan -y
      - name: Test
        run:
          mvn $MAVEN_CLI_OPTS -Dtestng.groups="travis" -Denforcer.skip=true clean org.jacoco:jacoco-maven-plugin:prepare-agent clean test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package
        run:
          mvn $MAVEN_CLI_OPTS -Dmaven.test.skip=true package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
